apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: http
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nonzod/kokko.git
    path: k8s/base/http
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: http
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
