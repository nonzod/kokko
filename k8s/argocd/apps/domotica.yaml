apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: domotica
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:nonzod/kokko.git
    path: k8s/base/domotica
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: domotica
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
