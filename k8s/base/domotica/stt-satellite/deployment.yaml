apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-satellite
spec:
  revisionHistoryLimit: 2
  replicas: 1
  selector:
    matchLabels:
      app: stt-satellite
  template:
    metadata:
      labels:
        app: stt-satellite
    spec:
      nodeSelector:
        role: voice-satellite
      containers:
      - name: stt-satellite
        image: python:3.11-slim-bookworm
        imagePullPolicy: Always
        securityContext:
          privileged: true
        command: ["/bin/bash", "-c"]
        args:
          - |
            if ! command -v arecord &> /dev/null; then
              apt-get update && apt-get install -y alsa-utils libasound2-plugins
            fi
            if ! python3 -c "import wyoming_satellite" &> /dev/null; then
              pip install --no-cache-dir "wyoming-satellite[silerovad]"
            fi
            
            echo "Starting wyoming_satellite..."
            exec python3 -m wyoming_satellite \
              --name "k3s-satellite" \
              --uri "tcp://0.0.0.0:10700" \
              --mic-command "arecord -D plughw:2,0 -r 16000 -c 1 -f S16_LE -t raw" \
              --snd-command "aplay -D plughw:1,0 -r 22050 -c 1 -f S16_LE -t raw" \
              --wake-uri "tcp://stt-openwakeword.domotica.svc.cluster.local:10400" \
              --wake-word-name "okay_nabu" \
              --event-uri "tcp://stt-whisper.domotica.svc.cluster.local:10300" \
              --no-vad \
              --debug
        ports:
        - containerPort: 10700
          name: wyoming
        resources:
          limits:
            memory: 512Mi
            cpu: "0.5"
          requests:
            memory: 128Mi
            cpu: "0.05"
        volumeMounts:
        - name: dev-snd
          mountPath: /dev/snd
      volumes:
      - name: dev-snd
        hostPath:
          path: /dev/snd