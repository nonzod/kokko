apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
spec:
  revisionHistoryLimit: 4
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      containers:
      - name: wireguard-client
        image: lscr.io/linuxserver/wireguard:latest
        imagePullPolicy: Always
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - SYS_MODULE
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        resources:
          limits:
            memory: 128Mi
            cpu: "0.1"
          requests:
            memory: 64Mi
            cpu: "0.05"
        volumeMounts:
        - name: wireguard-config
          mountPath: /config/wg_confs/wg0.conf
          subPath: wg0.conf
        - name: lib-modules
          mountPath: /lib/modules
          readOnly: true
      - name: homeassistant
        image: ghcr.io/home-assistant/home-assistant:stable
        imagePullPolicy: Always
        securityContext:
          privileged: true
        resources:
          limits:
            memory: 2Gi
            cpu: "1"
          requests:
            memory: 1Gi
            cpu: "0.2"
        volumeMounts:
        - name: ha-config
          mountPath: /config
        livenessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 60
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8123
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: ha-config
        persistentVolumeClaim:
          claimName: ha-config-pvc
      - name: wireguard-config
        secret:
          secretName: homeassistant-wireguard-client
      - name: lib-modules
        hostPath:
          path: /lib/modules
          type: Directory
      dnsConfig:
        options:
          - name: ndots
            value: "1"