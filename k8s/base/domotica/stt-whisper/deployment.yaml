      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-whisper
spec:
  selector:
    matchLabels:
      app: stt-whisper
  template:
    metadata:
      labels:
        app: stt-whisper
    spec:
      containers:
      - name: stt-whisper
        image: rhasspy/wyoming-whisper:latest
        imagePullPolicy: Always
        args:
          - "--model"
          - "tiny-int8"
          - "--language"
          - "it"
          - "--data-dir"
          - "/data"
        ports:
        - containerPort: 10300
          name: wyoming
