apiVersion: v1
kind: Service
metadata:
  name: samba-homeassistant
  namespace: domotica
  labels:
    app: samba-homeassistant
spec:
  type: LoadBalancer
  selector:
    app: samba-homeassistant
  ports:
  - port: 445
    targetPort: 445
    protocol: TCP
    name: cifs
  - port: 139
    targetPort: 139
    protocol: TCP
    name: netbios