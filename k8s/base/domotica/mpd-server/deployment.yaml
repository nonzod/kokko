apiVersion: apps/v1
kind: Deployment
metadata:
  name: mpd-server
  labels:
    app: mpd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mpd
  template:
    metadata:
      labels:
        app: mpd
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: mpd
        image: vimagick/mpd:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 6600
        env:
        - name: PULSE_SERVER
          value: "unix:/run/pulse/native"
        securityContext:
          runAsUser: 1000
        resources:
          limits:
            memory: 512Mi
            cpu: "0.5"
          requests:
            memory: 128Mi
            cpu: "0.1"
        volumeMounts:
        - name: mpd-data
          mountPath: /var/lib/mpd
        - name: mpd-config
          mountPath: /etc/mpd.conf
          subPath: mpd.conf
        - name: pulse-socket
          mountPath: /run/pulse
        - name: music
          mountPath: /var/lib/mpd/music
        livenessProbe:
          tcpSocket:
            port: 6600
          initialDelaySeconds: 30
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          tcpSocket:
            port: 6600
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: mpd-data
        persistentVolumeClaim:
          claimName: mpd-data-pvc
      - name: mpd-config
        configMap:
          name: mpd-config
      - name: pulse-socket
        hostPath:
          path: /run/user/1000/pulse
          type: Directory
      - name: music
        hostPath:
          path: /mnt/music
          type: DirectoryOrCreate
