apiVersion: v1
kind: Service
metadata:
  name: webcam-rtsp-service
  annotations:
    description: "RTSP server for USB webcam"
spec:
  selector:
    app: webcam-rtsp-server
  ports:
  - name: rtsp
    port: 8554
    targetPort: 8554
    protocol: TCP
  - name: rtmp
    port: 1935
    targetPort: 1935
    protocol: TCP
  - name: hls
    port: 8888
    targetPort: 8888
    protocol: TCP
  type: LoadBalancer