apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-mcp
spec:
  revisionHistoryLimit: 4
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ha-mcp
  template:
    metadata:
      labels:
        app: ha-mcp
    spec:
      containers:
      - name: ha-mcp
        image: ghcr.io/homeassistant-ai/ha-mcp:stable
        imagePullPolicy: Always
        command: ["python", "-c", "from ha_mcp.__main__ import main_web; main_web()"]
        ports:
        - containerPort: 8086
          name: http
        env:
        - name: HOMEASSISTANT_URL
          value: "http://homeassistant-web.domotica.svc.cluster.local:8123"
        - name: HOMEASSISTANT_TOKEN
          valueFrom:
            secretKeyRef:
              name: ha-mcp-homeassistant-token
              key: token
        - name: MCP_SECRET_PATH
          value: "/private_1234567890"  # Il valore verrà generato in fase di deployment
        resources:
          limits:
            memory: 512Mi
            cpu: "0.5"
          requests:
            memory: 256Mi
            cpu: "00.25"