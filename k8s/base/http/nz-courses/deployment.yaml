apiVersion: apps/v1
kind: Deployment
metadata:
  name: nz-courses
  namespace: http
  labels:
    app: nz-courses
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nz-courses
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: nz-courses
    spec:
      containers:
        - name: nz-courses
          image: nonzod/nz-courses-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: SHOPIFY_APP_URL
              valueFrom:
                configMapKeyRef:
                  name: nz-courses-config
                  key: SHOPIFY_APP_URL
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: nz-courses-config
                  key: PORT
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nz-courses-config
                  key: NODE_ENV
            - name: SHOPIFY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nz-courses-secret
                  key: SHOPIFY_API_KEY
            - name: SHOPIFY_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: nz-courses-secret
                  key: SHOPIFY_API_SECRET
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nz-courses-secret
                  key: DATABASE_URL
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: nz-courses-secret
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: nz-courses-secret
                  key: SMTP_PORT
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: nz-courses-secret
                  key: SMTP_USER
            - name: SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: nz-courses-secret
                  key: SMTP_PASS
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /app
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /app
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
