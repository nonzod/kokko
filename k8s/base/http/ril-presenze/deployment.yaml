---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ril-presenze
  namespace: http
  labels:
    app: ril-presenze
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ril-presenze
  template:
    metadata:
      labels:
        app: ril-presenze
    spec:
      containers:
      - name: ril-presenze
        image: nonzod/ril_presenze:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: JWT_SECRET
        - name: SHOPIFY_STORE_URL
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: SHOPIFY_STORE_URL
        - name: SHOPIFY_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: SHOPIFY_ACCESS_TOKEN
        - name: SHOPIFY_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: SHOPIFY_WEBHOOK_SECRET
        resources:
          requests:
            memory: "128Mi"
            cpu: "0.1"
          limits:
            memory: "512Mi"
            cpu: "0.5"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
