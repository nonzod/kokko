---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ril-presenze
  namespace: http
  labels:
    app: ril-presenze
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: ril-presenze
  template:
    metadata:
      labels:
        app: ril-presenze
    spec:
      initContainers:
      - name: volume-permissions
        image: busybox:1.36
        command: ["sh", "-c", "mkdir -p /app/localfiles/firmware && chown -R 1001:1001 /app/localfiles"]
        volumeMounts:
        - name: ril-presenze-data
          mountPath: /app/localfiles
      - name: migrate
        image: nonzod/ril_presenze:latest
        command: ["npx", "tsx", "scripts/migrate.ts"]
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: DATABASE_URL
        volumeMounts:
        - name: ril-presenze-data
          mountPath: /app/localfiles
      containers:
      - name: ril-presenze
        image: nonzod/ril_presenze:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: DATABASE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: JWT_SECRET
        - name: SHOPIFY_STORE_URL
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: SHOPIFY_STORE_URL
        - name: SHOPIFY_ACCESS_TOKEN
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: SHOPIFY_ACCESS_TOKEN
        - name: SHOPIFY_WEBHOOK_SECRET
          valueFrom:
            secretKeyRef:
              name: ril-presenze-secret
              key: SHOPIFY_WEBHOOK_SECRET
        - name: BODY_SIZE_LIMIT
          value: "52428800"
        resources:
          requests:
            memory: "128Mi"
            cpu: "0.1"
          limits:
            memory: "512Mi"
            cpu: "0.5"
        livenessProbe:
          httpGet:
            path: /status
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /status
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: ril-presenze-data
          mountPath: /app/localfiles
      volumes:
      - name: ril-presenze-data
        persistentVolumeClaim:
          claimName: ril-presenze-data-pvc
