---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nicolatomassoni-website
  namespace: http
  labels:
    app: nicolatomassoni-website
spec:
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: nicolatomassoni-website
  template:
    metadata:
      labels:
        app: nicolatomassoni-website
    spec:
      containers:
      - name: hugo
        image: ghcr.io/nonzod/personal-website:4f6e2d3324f6e40c3c860db82a241a9a7b23c0b8
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "0.05"
          limits:
            memory: "128Mi"
            cpu: "0.2"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10