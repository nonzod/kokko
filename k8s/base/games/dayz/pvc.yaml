---
# PVC per profiles (profiles)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dayz-profiles-pvc
  namespace: dayz
spec:
  accessModes:
    - ReadWriteOnce  # Solo server container
  resources:
