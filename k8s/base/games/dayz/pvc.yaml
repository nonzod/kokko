# PVC per homedir del web container (homedir_main)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dayz-homedir-web-pvc
  namespace: dayz
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
# PVC per homedir del server container (homedir_server)  
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dayz-homedir-server-pvc
  namespace: dayz
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path

---
# PVC per server files (serverfiles)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dayz-serverfiles-pvc
  namespace: dayz
spec:
  accessModes:
    - ReadWriteOnce  # Condiviso nel stesso pod
  resources:
    requests:
      storage: 15Gi
  storageClassName: local-path

---
# PVC per server mp missions (servermpmissions)
apiVersion: v1
kind: PersistentVolumeClaim
