# PVC per server files base DayZ
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dayz-serverfiles-pvc
  namespace: dayz
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 8Gi  # 2.7GB base + margine per aggiornamenti
---
# PVC per mods Steam Workshop (ridotto per test iniziali)
