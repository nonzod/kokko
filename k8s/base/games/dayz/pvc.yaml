# PVC per server files base DayZ
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dayz-serverfiles-pvc
  namespace: dayz
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi  # 2.7GB base + spazio aggiuntivo
---
# PVC per mods Steam Workshop
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dayz-mods-pvc
  namespace: dayz
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi  # Spazio per mods (possono essere molto grandi)
---
