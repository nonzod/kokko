apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dayz

resources:
# Nuova configurazione DayZ basata su dayzdockerserver
- pvc.yaml              # PVC multipli per volumi
- configmaps.yaml       # ConfigMaps per configurazione
- secret.yaml          # Secrets per credenziali Steam (da configurare)
- deployment.yaml       # Deployment con container server + web
- services.yaml         # Services aggiornati