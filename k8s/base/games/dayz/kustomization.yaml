apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dayz

resources:
- pvc.yaml              # PVC aggiornati (steamcmd, dayz-data, openssh)
- configmap.yaml        # ConfigMap con serverDZ.cfg e BEServer_x64.cfg
- serviceaccount.yaml   # ServiceAccount, Role, RoleBinding per CronJob
- deployment.yaml       # Deployment con DayZ + SSH container
- service.yaml          # Service con porte DayZ + SSH
- cronjob.yaml          # CronJob per restart automatico