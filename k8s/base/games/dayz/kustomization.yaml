apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dayz

resources:
- pvc.yaml              # PVC multipli per volumi
- configmaps.yaml       # ConfigMaps per configurazione
- secret.yaml          # Secrets per credenziali Steam  
- deployment.yaml       # Deployment corretto con un solo container
- services.yaml         # Services per porte DayZ