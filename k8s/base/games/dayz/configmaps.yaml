# ConfigMap per la configurazione del server DayZ
apiVersion: v1
kind: ConfigMap
metadata:
  name: dayz-server-config
  namespace: dayz
data:
  serverDZ.cfg: |
    hostname = "K3s DayZ Server";
    password = "";
    passwordAdmin = "";
    maxPlayers = 60;
    verifySignatures = 2;
    forceSameBuild = 1;
    disableVoN = 0;
    vonCodecQuality = 7;
    disable3rdPerson = 0;
    disableCrosshair = 0;
    disablePersonalLight = 1;
    lightingConfig = 1;
    serverTime = "SystemTime";
    serverTimeAcceleration = 4;
    serverNightTimeAcceleration = 1;
    serverTimePersistent = 0;
    guaranteedUpdates = 1;
    loginQueueConcurrentPlayers = 5;
    loginQueueMaxPlayers = 500;
    instanceId = 1;
    storeHouseStateDisabled = false;
    storageAutoFix = 1;
    respawnTime = 5;
    
    class Missions
    {
        class DayZ
        {
            template = "dayzOffline.chernarusplus";
        };
    };

---
# ConfigMap per variabili di ambiente
apiVersion: v1
kind: ConfigMap
metadata:
  name: dayz-environment-config
  namespace: dayz
data:
  # Configurazione utente
  USER_ID: "1000"
  # Configurazione locale
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US:en"
  LC_ALL: "en_US.UTF-8"
  # Configurazione porte
  GAME_PORT: "2302"
  RCON_PORT: "2303"
  STEAM_PORT: "27016"
  WEB_PORT: "8000"
  API_PORT: "8001"
  # Repository
  REPO_URL: "https://ceregatti.org/git/daniel/dayzdockerserver.git"