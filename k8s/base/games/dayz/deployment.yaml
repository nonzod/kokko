apiVersion: apps/v1
kind: Deployment
metadata:
  name: dayz-server
  namespace: dayz
  labels:
    app: dayz-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dayz-server
  template:
    metadata:
      labels:
        app: dayz-server
    spec:
      # Init container per setup iniziale e build
      initContainers:
      - name: setup-repo
        image: alpine/git:latest
        command:
        - /bin/sh
        - -c
        - |
          if [ ! -f /shared/setup-done ]; then
            echo "Cloning dayzdockerserver repository..."
            git clone https://ceregatti.org/git/daniel/dayzdockerserver.git /shared/repo
            touch /shared/setup-done
            echo "Repository cloned successfully"
          else
            echo "Setup already done, skipping..."
          fi
        volumeMounts:
        - name: shared-setup
          mountPath: /shared
        resources:
          requests:
            memory: "64Mi"
            cpu: "0.1"
          limits:
            memory: "128Mi"
            cpu: "0.2"
      
      containers:
      # Container Web per gestione
      - name: dayz-web
        image: ubuntu:22.04
        command:
        - /bin/bash
        - -c
        - |
          # Setup iniziale
          apt-get update && apt-get install -y \
            curl wget gnupg2 software-properties-common \
            python3 python3-pip build-essential
          
          # Installa Docker (per compatibilità script)
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg | apt-key add -
          add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
          apt-get update && apt-get install -y docker-ce-cli
          
          # Copy dei file dal repository
          cp -r /shared/repo/* /app/
          cd /app
          
          # Setup environment
          echo "UID=1000" > .env
          
          # Mantieni container attivo per gestione
          echo "Web container ready for management"
          tail -f /dev/null
        
        ports:
        - containerPort: 3000  # Porta per interfaccia web (se presente)
        
        env:
        - name: UID
          valueFrom:
            configMapKeyRef:
              name: dayz-env-config
              key: UID
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: dayz-env-config
              key: TZ
        - name: STEAM_USERNAME
          valueFrom:
            secretKeyRef:
              name: dayz-steam-secret
              key: STEAM_USERNAME
        - name: STEAM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dayz-steam-secret
              key: STEAM_PASSWORD
        
        volumeMounts:
        - name: shared-setup
          mountPath: /shared
        - name: serverfiles
          mountPath: /app/serverfiles
        - name: mods
          mountPath: /app/mods
        - name: homedir
          mountPath: /app/homedir
        - name: dayz-config
          mountPath: /app/files/serverDZ.cfg
          subPath: serverDZ.cfg
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "0.2"
          limits:
            memory: "1Gi"
            cpu: "0.5"
      
      # Container Server DayZ
      - name: dayz-server
        image: ubuntu:22.04
        command:
        - /bin/bash
        - -c
        - |
          # Setup iniziale simile al web container
          apt-get update && apt-get install -y \
            curl wget gnupg2 software-properties-common \
            python3 python3-pip build-essential \
            lib32gcc-s1 lib32stdc++6 steamcmd
          
          # Copy dei file dal repository
          cp -r /shared/repo/* /app/
          cd /app
          
          # Setup environment
          echo "UID=1000" > .env
          
          # Aspetta che web container completi setup iniziale
          echo "Waiting for initial setup..."
          sleep 60
          
          # Installa server se non già presente
          if [ ! -f /app/serverfiles/DayZServer ]; then
            echo "Installing DayZ server files..."
            # Usa gli script del progetto per installazione
            /app/files/bin/dz install || echo "Install will be completed on first run"
          fi
          
          # Avvia server
          echo "Starting DayZ server..."
          exec /app/files/bin/dz start
        
        ports:
        - containerPort: 2302
          protocol: UDP
          name: game-udp
        - containerPort: 2303
          protocol: UDP
          name: game-udp2
        - containerPort: 2304
          protocol: UDP
          name: game-udp3
        - containerPort: 2305
          protocol: UDP
          name: game-udp4
        - containerPort: 27016
          protocol: UDP
          name: query
        
        env:
        - name: UID
          valueFrom:
            configMapKeyRef:
              name: dayz-env-config
              key: UID
        - name: TZ
          valueFrom:
            configMapKeyRef:
              name: dayz-env-config
              key: TZ
        - name: STEAM_USERNAME
          valueFrom:
            secretKeyRef:
              name: dayz-steam-secret
              key: STEAM_USERNAME
        - name: STEAM_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dayz-steam-secret
              key: STEAM_PASSWORD
        
        volumeMounts:
        - name: shared-setup
          mountPath: /shared
        - name: serverfiles
          mountPath: /app/serverfiles
        - name: mods
          mountPath: /app/mods
        - name: homedir
          mountPath: /app/homedir
        - name: profiles
          mountPath: /app/profiles
        - name: servermpmissions
          mountPath: /app/servermpmissions
        - name: dayz-config
          mountPath: /app/files/serverDZ.cfg
          subPath: serverDZ.cfg
        
        resources:
          requests:
            memory: "4Gi"
            cpu: "0.5"
          limits:
            memory: "6Gi"
            cpu: "1"
      
      volumes:
      # Volume temporaneo per condivisione setup
      - name: shared-setup
        emptyDir: {}
      
      # Volumi persistenti
      - name: serverfiles
        persistentVolumeClaim:
          claimName: dayz-serverfiles-pvc
      - name: mods
        persistentVolumeClaim:
          claimName: dayz-mods-pvc
      - name: homedir
        persistentVolumeClaim:
          claimName: dayz-homedir-pvc
      - name: profiles
        persistentVolumeClaim:
          claimName: dayz-profiles-pvc
      - name: servermpmissions
        persistentVolumeClaim:
          claimName: dayz-servermpmissions-pvc
      
      # ConfigMap per configurazione server
      - name: dayz-config
        configMap:
          name: dayz-server-config
          defaultMode: 0644
      dnsConfig:
        options:
          - name: ndots
            value: "1"