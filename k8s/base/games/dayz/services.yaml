# Service per il web container - gestione web UI e API
apiVersion: v1
kind: Service
metadata:
  name: dayz-web-service
  namespace: dayz
  labels:
    app: dayz-server
    component: web
spec:
  type: NodePort
  selector:
    app: dayz-server
  ports:
  - name: web-ui
    port: 8000
    targetPort: 8000
    protocol: TCP
    nodePort: 30800  # Accesso esterno via :30800
  - name: web-api  
    port: 8001
    targetPort: 8001
    protocol: TCP
    nodePort: 30801  # Accesso esterno via :30801

---
# Service per il server DayZ - informativo (usa hostNetwork)
# Le porte sono già esposte direttamente sull'host grazie a hostNetwork: true
apiVersion: v1
kind: Service
metadata:
  name: dayz-server-service
  namespace: dayz
  labels:
    app: dayz-server
    component: server
  annotations:
    service.kubernetes.io/external-traffic: OnlyLocal
    # Nota: questo servizio è puramente informativo
    # Il server usa hostNetwork quindi le porte sono esposte direttamente:
    # - 2302/UDP: Game port 
    # - 2303/UDP: RCON port
    # - 27016/UDP: Steam port
spec:
  type: ClusterIP
  clusterIP: None  # Headless service
  selector:
    app: dayz-server
  ports:
  - name: game-port
    port: 2302
    targetPort: 2302
    protocol: UDP
  - name: rcon-port
    port: 2303
    targetPort: 2303
    protocol: UDP
  - name: steam-port
    port: 27016
    targetPort: 27016
    protocol: UDP