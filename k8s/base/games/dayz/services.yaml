# Service principale per DayZ server
apiVersion: v1
kind: Service
metadata:
  name: dayz-server-service
  namespace: dayz
  labels:
    app: dayz-server
spec:
  type: LoadBalancer
  selector:
    app: dayz-server
  ports:
  # Porte DayZ server
  - name: game-udp
    port: 2302
    targetPort: 2302
    protocol: UDP
  - name: game-udp2
    port: 2303
    targetPort: 2303
    protocol: UDP
  - name: game-udp3
    port: 2304
    targetPort: 2304
    protocol: UDP
  - name: game-udp4
    port: 2305
    targetPort: 2305
    protocol: UDP
  - name: query
    port: 27016
    targetPort: 27016
    protocol: UDP
---
# Service per gestione web (se utilizzato)
apiVersion: v1
kind: Service
metadata:
  name: dayz-web-service
  namespace: dayz
  labels:
    app: dayz-server
spec:
  type: ClusterIP
  selector:
    app: dayz-server
  ports:
  - name: web-management
    port: 3000
    targetPort: 3000
    protocol: TCP