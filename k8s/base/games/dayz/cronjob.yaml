# CronJob per restart automatico ogni 12 ore
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restart-dayz
  namespace: dayz
spec:
  schedule: "0 */12 * * *"  # Ogni 12 ore
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: dayz-restart-sa
          containers:
          - name: kubectl-restart
            image: bitnami/kubectl:latest
            command:
            - /bin/sh
            - -c
            - |
              kubectl patch deployment dayz-server -n dayz -p '{"spec":{"template":{"metadata":{"annotations":{"kubectl.kubernetes.io/restartedAt":"'$(date -Iseconds)'"}}}}}'
          restartPolicy: OnFailure