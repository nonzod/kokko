
# ServiceAccount per il CronJob
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dayz-restart-sa
  namespace: dayz
---
# Role per permettere al CronJob di fare restart del deployment
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dayz-restart-role
  namespace: dayz
rules:
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "patch"]
---
# RoleBinding per associare Role e ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dayz-restart-binding
  namespace: dayz
subjects:
- kind: ServiceAccount
  name: dayz-restart-sa
  namespace: dayz
roleRef:
  kind: Role
  name: dayz-restart-role
  apiGroup: rbac.authorization.k8s.io